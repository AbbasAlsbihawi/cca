name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: zsh -n cca.zsh
      - run: zsh tests/run.sh
      - name: Syntax-check cca.ps1
        run: |
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("cca.ps1",[ref]$null,[ref]$e); if($e){$e|ForEach-Object{$_.Message}; exit 1}'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Syntax-check the desktop app
        run: |
          for f in $(find desktop/main desktop/renderer -name '*.js') desktop/preload.js; do
            node --check "$f"
          done
