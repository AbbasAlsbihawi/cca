name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: zsh -n cca.zsh
      - run: zsh tests/run.sh
      - name: Syntax-check every .ps1
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (Get-ChildItem -Recurse -File -Filter *.ps1)) {
            if ($f.FullName -like '*node_modules*') { continue }
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad = 1; "--- $($f.FullName)"; $e | ForEach-Object { $_.Message } }
          }
          exit $bad
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Syntax-check the desktop app
        run: |
          for f in $(find desktop/main desktop/renderer -name '*.js') desktop/preload.js; do
            node --check "$f"
          done
