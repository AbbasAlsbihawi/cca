name: Feature request
description: Suggest an improvement or a new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. CCA organizes your own Claude accounts; requests to get around usage limits or organizational policies will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like CCA to handle it. Example commands or screens help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you have tried or thought about.
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
