<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<meta name="color-scheme" content="light dark">
<title>CCA</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<nav id="sidebar" aria-label="Accounts">
  <div class="drag-strip"></div>
  <div id="side-list"></div>
  <footer id="side-foot">
    <button id="btn-add" class="square" title="Add Account (⌘N)" aria-label="Add Account">+</button>
    <button id="btn-remove" class="square" title="Remove Account" aria-label="Remove Account">−</button>
    <button id="side-update" class="link-quiet" hidden>
      <progress id="side-update-bar" max="100" hidden></progress>
      <span id="side-update-text"></span>
    </button>
  </footer>
</nav>
<main id="content">
  <header id="titlebar"><h1 id="page-title"></h1></header>
  <div id="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button id="banner-details" class="link">Show Activity</button>
    <button id="banner-close" class="link" aria-label="Dismiss">✕</button>
  </div>
  <section id="detail"></section>
  <section id="output-panel" aria-label="Activity" hidden>
    <div id="output-bar">
      <span class="output-title">Activity</span>
      <span class="spacer"></span>
      <button id="output-clear" class="link">Clear</button>
      <button id="output-close" class="link">Hide</button>
    </div>
    <pre id="output-log"></pre>
  </section>
</main>
<div id="sheet-backdrop" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
</body>
</html>
